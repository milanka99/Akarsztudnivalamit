<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>💌 Akarsz tudni valamit?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Fredoka', 'Segoe UI', 'Trebuchet MS', sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  .screen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    transition: opacity .9s ease;
  }
  .hidden { opacity: 0; pointer-events: none; }

  /* ---------- Question screen ---------- */
  #question {
    background: linear-gradient(135deg, #fff0f6 0%, #ffe1ec 50%, #ffd6e7 100%);
  }
  .card {
    background: #fff;
    padding: 48px 44px 44px;
    border-radius: 32px;
    box-shadow: 0 24px 70px rgba(255, 92, 147, .28);
    text-align: center;
    max-width: 92vw;
    animation: floaty 3.5s ease-in-out infinite;
  }
  .card .emoji { font-size: 56px; margin-bottom: 10px; display: block; }
  h1 {
    font-weight: 700;
    color: #e8467c;
    font-size: clamp(30px, 6.5vw, 50px);
    letter-spacing: .5px;
    margin-bottom: 34px;
    min-height: 1.3em;
  }
  .buttons { display: flex; gap: 22px; justify-content: center; flex-wrap: wrap; }
  button {
    font-family: inherit;
    font-weight: 700;
    font-size: 23px;
    padding: 13px 46px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease, background .3s ease, color .3s ease;
  }
  button:hover { transform: scale(1.08); }
  button:active { transform: scale(.96); }
  .yes {
    background: linear-gradient(135deg, #ff6fa3, #ff3d7f);
    color: #fff;
    box-shadow: 0 10px 24px rgba(255, 61, 127, .4);
  }
  .no { background: #f1f1f1; color: #888; }

  .shake { animation: shake .5s ease, floaty 3.5s ease-in-out .5s infinite; }
  .pop-in { animation: popIn .45s cubic-bezier(.3,1.6,.5,1); }

  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-12px) rotate(-2deg); }
    40% { transform: translateX(12px) rotate(2deg); }
    60% { transform: translateX(-8px); }
    80% { transform: translateX(8px); }
  }
  @keyframes popIn { 0% { transform: scale(.4); } 100% { transform: scale(1); } }

  /* ---------- Love screen ---------- */
  #love {
    background: radial-gradient(circle at 50% 40%, #ffe0ec 0%, #ffb3d1 45%, #ff86b4 100%);
    cursor: pointer;
    overflow: hidden;
  }
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #fx, #sky { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #sky { z-index: 4; }
  #fx { z-index: 8; }

  .popup {
    position: absolute;
    font-weight: 700;
    color: #fff;
    font-size: clamp(28px, 6vw, 50px);
    letter-spacing: .5px;
    white-space: nowrap;
    -webkit-text-stroke: 1.5px #ff3d7f;
    paint-order: stroke fill;
    text-shadow: 0 0 10px rgba(255, 61, 127, .8), 0 4px 0 #e8467c, 0 6px 14px rgba(160, 0, 70, .35);
    transform: translate(-50%, -50%);
    animation: popText 2.8s ease-out forwards;
  }
  .popup.points {
    color: #fff7c2;
    -webkit-text-stroke: 1.5px #e0a200;
    text-shadow: 0 0 12px rgba(255, 196, 0, .9), 0 4px 0 #d18b00, 0 6px 14px rgba(120, 70, 0, .35);
    font-size: clamp(24px, 5vw, 40px);
  }
  @keyframes popText {
    0%   { transform: translate(-50%, -50%) scale(0) rotate(-8deg); opacity: 0; }
    14%  { transform: translate(-50%, -50%) scale(1.25) rotate(3deg); opacity: 1; }
    24%  { transform: translate(-50%, -55%) scale(1) rotate(0deg); opacity: 1; }
    75%  { opacity: 1; }
    100% { transform: translate(-50%, -170%) scale(.95); opacity: 0; }
  }
  .burst { position: absolute; pointer-events: none; }

  .hint {
    position: absolute;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-weight: 600;
    font-size: 19px;
    text-shadow: 0 2px 8px rgba(232, 70, 124, .6);
    animation: pulse 1.6s ease-in-out infinite;
    transition: opacity .8s;
    z-index: 6;
    pointer-events: none;
    white-space: nowrap;
  }
  @keyframes pulse { 0%,100% { opacity: .65; } 50% { opacity: 1; } }

  /* ---------- Flying cat ---------- */
  .cat {
    position: absolute;
    left: 0; top: 0;
    width: 120px;
    height: 100px;
    pointer-events: none;
    filter: drop-shadow(0 6px 8px rgba(180, 40, 100, .25));
  }
  .cat .wing { transform-box: view-box; transform-origin: 52px 44px; animation: flap .32s ease-in-out infinite alternate; }
  .cat .wing.back { animation-delay: -.08s; }
  @keyframes flap { from { transform: rotate(-28deg); } to { transform: rotate(18deg); } }

  /* ---------- Gifts ---------- */
  .gift {
    position: absolute;
    left: 0; top: 0;
    font-size: 44px;
    line-height: 1;
    pointer-events: auto;
    cursor: pointer;
    filter: drop-shadow(0 4px 6px rgba(150, 30, 90, .35));
    transition: opacity .6s;
    padding: 6px; /* bigger tap area */
    margin: -6px;
  }
  .gift.landed span { display: inline-block; animation: wobble 1.4s ease-in-out infinite; }
  .gift.fade { opacity: 0; pointer-events: none; }
  @keyframes wobble { 0%,100% { transform: rotate(-6deg) scale(1); } 50% { transform: rotate(6deg) scale(1.08); } }

  /* ---------- Counter ---------- */
  #counter {
    position: absolute;
    left: 16px;
    bottom: 16px;
    z-index: 7;
    background: rgba(255, 255, 255, .85);
    color: #e8467c;
    font-weight: 700;
    font-size: 18px;
    padding: 9px 16px;
    border-radius: 999px;
    box-shadow: 0 6px 18px rgba(232, 70, 124, .3);
    pointer-events: none;
    white-space: nowrap;
  }
  #counter b { color: #ff3d7f; font-size: 22px; display: inline-block; }
  #counter.bump b { animation: bump .5s cubic-bezier(.3,1.8,.5,1); }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.8); } 100% { transform: scale(1); } }

  /* ---------- Big reward ---------- */
  #reward {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(255, 90, 150, .35);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    text-align: center;
    padding: 20px;
    transition: opacity .6s;
  }
  #reward.hidden { opacity: 0; pointer-events: none; }
  #reward .big {
    font-weight: 700;
    color: #fff;
    font-size: clamp(40px, 10vw, 110px);
    line-height: 1.1;
    -webkit-text-stroke: 2.5px #ff3d7f;
    paint-order: stroke fill;
    text-shadow: 0 0 20px rgba(255, 61, 127, .9), 0 7px 0 #e8467c, 0 12px 28px rgba(160, 0, 70, .4);
  }
  #reward .emo { font-size: clamp(50px, 11vw, 100px); margin-top: 10px; }
  #reward:not(.hidden) .big { animation: rewardIn .9s cubic-bezier(.3,1.6,.5,1), rewardPulse 1.4s ease-in-out .9s infinite; }
  #reward .sub { color: #fff; font-weight: 600; font-size: 18px; margin-top: 24px; opacity: .9; text-shadow: 0 2px 6px rgba(200, 40, 100, .6); }
  @keyframes rewardIn { 0% { transform: scale(0) rotate(-12deg); } 100% { transform: scale(1) rotate(0); } }
  @keyframes rewardPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
</style>
</head>
<body>

<!-- Question screen -->
<section id="question" class="screen">
  <div class="card" id="card">
    <span class="emoji">💌</span>
    <h1 id="title">Akarsz tudni valamit?</h1>
    <div class="buttons">
      <button class="yes" id="yesBtn">Igen</button>
      <button class="no" id="noBtn">Nem</button>
    </div>
  </div>
</section>

<!-- Love screen -->
<section id="love" class="screen hidden">
  <canvas id="canvas"></canvas>
  <div id="sky"></div>
  <div id="fx"></div>
  <div class="hint" id="hint">kattints bárhova 💕</div>
  <div id="counter">💅 good girl points: <b id="points">0</b></div>
  <div id="reward" class="hidden">
    <div class="big">Meghívlak egy kínaira</div>
    <div class="emo">🥡🥢🥟</div>
    <div class="sub">(koppints a folytatáshoz)</div>
  </div>
</section>

<!-- Winged kitten template -->
<template id="catTpl">
  <svg class="cat" viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">
    <!-- back wing -->
    <g class="wing back">
      <path d="M52 44 C40 18, 22 8, 8 14 C16 20, 14 26, 22 30 C14 32, 16 40, 26 40 C22 46, 34 48, 52 44 Z" fill="#fde7f1" stroke="#f3a6c8" stroke-width="2"/>
    </g>
    <!-- tail -->
    <path d="M28 64 C14 62, 8 50, 14 42 C18 38, 22 42, 19 46 C16 52, 22 58, 30 58" fill="none" stroke="#e8955a" stroke-width="7" stroke-linecap="round"/>
    <path d="M28 64 C14 62, 8 50, 14 42 C18 38, 22 42, 19 46 C16 52, 22 58, 30 58" fill="none" stroke="#ffc98b" stroke-width="4" stroke-linecap="round"/>
    <!-- legs -->
    <ellipse cx="42" cy="78" rx="6" ry="7" fill="#ffc98b" stroke="#e8955a" stroke-width="2"/>
    <ellipse cx="68" cy="79" rx="6" ry="7" fill="#ffc98b" stroke="#e8955a" stroke-width="2"/>
    <!-- body -->
    <ellipse cx="55" cy="62" rx="29" ry="19" fill="#ffc98b" stroke="#e8955a" stroke-width="2.5"/>
    <path d="M44 46 q3 8 0 14 M54 44 q3 9 0 16 M64 45 q3 8 0 14" fill="none" stroke="#f0a868" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="58" cy="70" rx="15" ry="8" fill="#fff1e0"/>
    <!-- front wing -->
    <g class="wing">
      <path d="M54 46 C44 16, 26 2, 10 6 C18 13, 16 20, 25 25 C15 27, 18 36, 29 37 C24 44, 38 49, 54 46 Z" fill="#ffffff" stroke="#f3a6c8" stroke-width="2"/>
      <path d="M50 42 C40 30, 30 20, 20 14" fill="none" stroke="#f9cde0" stroke-width="1.5"/>
    </g>
    <!-- head -->
    <path d="M74 30 L76 10 L88 24 Z" fill="#ffc98b" stroke="#e8955a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M98 24 L108 8 L110 30 Z" fill="#ffc98b" stroke="#e8955a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M77 26 L78 15 L85 23 Z" fill="#ffb3cc"/>
    <path d="M100 24 L106 13 L107 27 Z" fill="#ffb3cc"/>
    <circle cx="92" cy="42" r="22" fill="#ffc98b" stroke="#e8955a" stroke-width="2.5"/>
    <path d="M86 22 q2 5 0 8 M93 21 q2 5 0 8" fill="none" stroke="#f0a868" stroke-width="2.5" stroke-linecap="round"/>
    <!-- eyes -->
    <ellipse cx="84" cy="41" rx="4.2" ry="5" fill="#2b1b2e"/>
    <ellipse cx="101" cy="41" rx="4.2" ry="5" fill="#2b1b2e"/>
    <circle cx="85.5" cy="39" r="1.6" fill="#fff"/>
    <circle cx="102.5" cy="39" r="1.6" fill="#fff"/>
    <!-- blush -->
    <ellipse cx="79" cy="50" rx="4.5" ry="2.6" fill="#ff8fb8" opacity=".75"/>
    <ellipse cx="106" cy="50" rx="4.5" ry="2.6" fill="#ff8fb8" opacity=".75"/>
    <!-- nose & mouth -->
    <path d="M90.5 47 h4 l-2 2.4 Z" fill="#ff6f9f"/>
    <path d="M88.5 51 q2 2.5 4 0 q2 2.5 4 0" fill="none" stroke="#2b1b2e" stroke-width="1.5" stroke-linecap="round"/>
    <!-- whiskers -->
    <path d="M74 47 h-9 M74 51 l-8 2 M111 47 h9 M111 51 l8 2" stroke="#c97a45" stroke-width="1.3" stroke-linecap="round"/>
  </svg>
</template>

<script>
(() => {
  /* ================= Question logic ================= */
  const title = document.getElementById('title');
  const card = document.getElementById('card');
  const yesBtn = document.getElementById('yesBtn');
  const noBtn = document.getElementById('noBtn');
  let noTurnedYes = false;

  yesBtn.addEventListener('click', goLove);
  noBtn.addEventListener('click', () => {
    if (!noTurnedYes) {
      noTurnedYes = true;
      title.textContent = 'olyan nincs hogy nem 😤';
      noBtn.textContent = 'Igen';
      noBtn.classList.remove('no');
      noBtn.classList.add('yes', 'pop-in');
      card.classList.remove('shake');
      void card.offsetWidth; // restart animation
      card.classList.add('shake');
    } else {
      goLove();
    }
  });

  /* ================= Love screen ================= */
  const love = document.getElementById('love');
  const fx = document.getElementById('fx');
  const sky = document.getElementById('sky');
  const hint = document.getElementById('hint');
  const counter = document.getElementById('counter');
  const pointsEl = document.getElementById('points');
  const reward = document.getElementById('reward');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  const MESSAGES = [
    'szeretlek 💖',
    'gyönyörű vagy ✨',
    'legjobb barátnő vagy 🥰',
    'imádom a nevetésed 😄',
    'feldobod a napjaim ☀️',
    'hiányzol 🥺',
    'még mindig te vagy a crushom 😳💘',
    'cuki vagy 🥹',
    'spongyabob kockanadrág 🧽',
    'sziaaaaaa 👋',
    'naaffiri hiányol téged 🐾'
  ];
  let bag = [];
  let lastMsg = null;
  function nextMessage() {
    if (!bag.length) {
      bag = MESSAGES.slice().sort(() => Math.random() - .5);
      if (bag[bag.length - 1] === lastMsg) bag.unshift(bag.pop());
    }
    lastMsg = bag.pop();
    return lastMsg;
  }

  let started = false;
  function goLove() {
    if (started) return;
    started = true;
    document.getElementById('question').classList.add('hidden');
    love.classList.remove('hidden');
    startSnakes();
    nextCatAt = performance.now() + 6000; // first kitten after ~6s
    setTimeout(() => showPopup(nextMessage(), W / 2, H / 2), 700);
  }

  /* ---- click anywhere: popup text + heart burst ---- */
  const HEART_EMOJI = ['💖', '💕', '💗', '💓', '💞', '❤️', '🩷', '💘'];
  let hintHidden = false;
  love.addEventListener('pointerdown', (e) => {
    if (!reward.classList.contains('hidden')) return;
    showPopup(nextMessage(), e.clientX, e.clientY);
    burst(e.clientX, e.clientY, HEART_EMOJI, 10);
    if (!hintHidden) { hintHidden = true; hint.style.opacity = 0; }
  });

  function showPopup(text, x, y, cls) {
    const el = document.createElement('div');
    el.className = 'popup' + (cls ? ' ' + cls : '');
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    fx.appendChild(el);
    // keep it on screen
    const w = el.offsetWidth, h = el.offsetHeight;
    const cx = Math.min(Math.max(x, w / 2 + 10), W - w / 2 - 10);
    const cy = Math.min(Math.max(y, h + 10), H - h / 2 - 10);
    el.style.left = (w + 20 > W ? W / 2 : cx) + 'px';
    el.style.top = cy + 'px';
    el.addEventListener('animationend', () => el.remove());
  }

  function burst(x, y, set, n, spread = 1) {
    for (let i = 0; i < n; i++) {
      const el = document.createElement('span');
      el.className = 'burst';
      el.textContent = set[Math.floor(Math.random() * set.length)];
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.style.fontSize = (12 + Math.random() * 14) * (spread > 1 ? 1.6 : 1) + 'px';
      fx.appendChild(el);
      const ang = (i / n) * Math.PI * 2 + Math.random() * .4;
      const dist = (60 + Math.random() * 70) * spread;
      const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist;
      el.animate([
        { transform: 'translate(-50%,-50%) scale(.3)', opacity: 1 },
        { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1)`, opacity: 1, offset: .6 },
        { transform: `translate(calc(-50% + ${dx * 1.2}px), calc(-50% + ${dy * 1.2 + 30}px)) scale(.6)`, opacity: 0 }
      ], { duration: (1100 + Math.random() * 400) * (spread > 1 ? 1.5 : 1), easing: 'cubic-bezier(.2,.8,.3,1)' }).onfinish = () => el.remove();
    }
  }

  /* ================= Good girl points ================= */
  const GOAL = 10;
  let points = 0;
  let rewardShown = false;

  function addPoint(x, y) {
    points++;
    pointsEl.textContent = points;
    counter.classList.remove('bump');
    void counter.offsetWidth;
    counter.classList.add('bump');
    showPopup('+1 good girl point', x, y - 30, 'points');
    burst(x, y, ['⭐', '✨', '🌟'], 8);
    if (points >= GOAL && !rewardShown) {
      rewardShown = true;
      setTimeout(showReward, 900);
    }
  }

  function showReward() {
    reward.classList.remove('hidden');
    const party = ['🥡', '🥢', '🥟', '🎉', '💖', '✨', '🍜'];
    burst(W / 2, H / 2, party, 24, 3);
    setTimeout(() => burst(W / 2, H / 2, party, 24, 4), 500);
  }
  reward.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    reward.classList.add('hidden');
  });

  /* ================= Flying kitten + gifts ================= */
  const catTpl = document.getElementById('catTpl');
  let cat = null;
  let nextCatAt = Infinity;
  const gifts = [];

  function spawnCat() {
    const el = catTpl.content.firstElementChild.cloneNode(true);
    sky.appendChild(el);
    const dir = Math.random() < .5 ? 1 : -1;      // 1 = flies left -> right
    const scale = clamp(Math.min(W, H) / 700, .65, 1.1);
    const nGifts = Math.random() < .5 ? 1 : 2;
    const drops = [];
    for (let i = 0; i < nGifts; i++) drops.push(W * rand(.15, .85));
    drops.sort((a, b) => dir * (a - b));
    cat = {
      el, dir, scale,
      x: dir === 1 ? -140 : W + 140,
      baseY: H * rand(.1, .3),
      phase: rand(0, 6),
      speed: rand(95, 130),
      drops
    };
  }

  function updateCat(dt, now) {
    if (!cat) {
      if (now >= nextCatAt) spawnCat();
      return;
    }
    cat.x += cat.dir * cat.speed * dt / 1000;
    cat.phase += dt / 1000 * 2.4;
    const y = cat.baseY + Math.sin(cat.phase) * 18;
    // origin is the element center, so scale/flip happens around (x, y)
    cat.el.style.transform =
      `translate(${cat.x - 60}px, ${y - 50}px) scale(${cat.scale * cat.dir}, ${cat.scale})`;

    // drop a gift when passing a drop point
    if (cat.drops.length && (cat.dir === 1 ? cat.x >= cat.drops[0] : cat.x <= cat.drops[0])) {
      cat.drops.shift();
      dropGift(cat.x, y + 30 * cat.scale);
    }

    if ((cat.dir === 1 && cat.x > W + 160) || (cat.dir === -1 && cat.x < -160)) {
      cat.el.remove();
      cat = null;
      nextCatAt = now + rand(12000, 22000); // not too frequent
    }
  }

  function dropGift(x, y) {
    const el = document.createElement('div');
    el.className = 'gift';
    el.innerHTML = '<span>🎁</span>';
    sky.appendChild(el);
    const g = {
      el, x, y,
      vy: 0,
      landY: H - rand(70, 140),
      sway: rand(0, 6),
      landed: false, landedAt: 0, done: false
    };
    el.addEventListener('pointerdown', (e) => {
      e.stopPropagation(); // no normal popup text when clicking gifts
      if (g.done) return;
      g.done = true;
      addPoint(e.clientX, e.clientY);
      el.animate([
        { transform: el.style.transform + ' scale(1)', opacity: 1 },
        { transform: el.style.transform + ' scale(1.8)', opacity: 0 }
      ], { duration: 350, easing: 'ease-out' }).onfinish = () => el.remove();
    });
    gifts.push(g);
  }

  function updateGifts(dt, now) {
    for (let i = gifts.length - 1; i >= 0; i--) {
      const g = gifts[i];
      if (g.done) { gifts.splice(i, 1); continue; }
      if (!g.landed) {
        g.vy = Math.min(g.vy + 260 * dt / 1000, 150);
        g.y += g.vy * dt / 1000;
        g.sway += dt / 1000 * 3;
        if (g.y >= g.landY) { g.y = g.landY; g.landed = true; g.landedAt = now; g.el.classList.add('landed'); }
      } else if (now - g.landedAt > 14000) {
        g.done = true;
        g.el.classList.add('fade');
        setTimeout(() => g.el.remove(), 700);
        continue;
      }
      const rot = g.landed ? 0 : Math.sin(g.sway) * 15;
      g.el.style.transform = `translate(${g.x - 28}px, ${g.y - 28}px) rotate(${rot}deg)`;
    }
  }

  /* ================= Snakes ================= */
  let W = innerWidth, H = innerHeight, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  addEventListener('resize', resize);
  resize();

  const STEP = 2;          // px between history points
  const GAP = 3;           // history points between body segments
  const SEGS = 18;         // body segments
  const TAIL_IDX = SEGS * GAP;
  const HEAD_R = 7.5;
  const SPEED = 120;       // px / second
  const BEAM_LIFE = 5200;  // ms a beam stays visible

  // [body, stripe, outline]
  const PALETTE = [
    ['#7fe08f', '#c4f5a8', '#3fa45a'],
    ['#8fd3ff', '#d2efff', '#3f8fc9'],
    ['#c9a6ff', '#ecdcff', '#8a5ad8'],
    ['#ffd36e', '#fff0b8', '#d29a22'],
    ['#ff9ec7', '#ffd8ea', '#d8558e'],
    ['#8ff0dc', '#d5fff5', '#2fae95'],
    ['#ffb38a', '#ffe1cf', '#d9733e'],
  ];
  const BEAMS = ['#ff2e74', '#ff5fa2', '#ff3b5c', '#e64bff', '#ff7ac0', '#ff4f8b', '#d93cff'];

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function heartPt(t) {
    const s = Math.sin(t);
    return {
      x: 16 * s * s * s,
      y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
    };
  }
  function heartSpeed(t) {
    const e = 0.001, a = heartPt(t), b = heartPt(t + e);
    return Math.hypot(b.x - a.x, b.y - a.y) / e;
  }
  function heartScale() {
    const base = Math.min(W, H);
    return clamp(base * rand(0.005, 0.0085), 2.6, 9);
  }

  const particles = [];

  class Snake {
    constructor(i) {
      const p = PALETTE[i % PALETTE.length];
      this.col = p[0]; this.stripe = p[1]; this.outline = p[2];
      this.beamCol = BEAMS[(i * 3) % BEAMS.length];
      this.x = rand(40, W - 40);
      this.y = rand(40, H - 40);
      this.angle = rand(0, Math.PI * 2);
      this.wig = rand(0, 10);
      this.acc = 0;
      this.hist = [];
      for (let k = TAIL_IDX + 4; k >= 0; k--) {
        this.hist.push({ x: this.x - Math.cos(this.angle) * k * STEP, y: this.y - Math.sin(this.angle) * k * STEP, d: false });
      }
      this.beam = [];
      this.state = 'travel';
      this.tongueSeed = rand(0, 100);
      this.pickTarget();
    }

    pickTarget() {
      this.s = heartScale();
      const mx = this.s * 16 + 15;
      const top = this.s * 13 + 15, bottom = this.s * 17 + 15;
      this.cx = mx + Math.random() * Math.max(1, W - 2 * mx);
      this.cy = top + Math.random() * Math.max(1, H - top - bottom);
      this.tx = this.cx;
      this.ty = this.cy - 5 * this.s; // heart starts at its top dip
      this.dir = Math.random() < .5 ? 1 : -1;
    }

    stepOnce(now) {
      if (this.state === 'travel') {
        const dx = this.tx - this.x, dy = this.ty - this.y;
        const dist = Math.hypot(dx, dy);
        let diff = Math.atan2(dy, dx) - this.angle;
        diff = Math.atan2(Math.sin(diff), Math.cos(diff));
        const turn = dist < 70 ? 0.4 : 0.07;
        this.angle += clamp(diff, -turn, turn);
        this.wig += 0.09;
        const a = this.angle + (dist > 50 ? Math.sin(this.wig) * 0.55 : 0);
        this.x += Math.cos(a) * STEP;
        this.y += Math.sin(a) * STEP;
        if (dist < 10) {
          this.x = this.tx; this.y = this.ty;
          this.state = 'draw';
          this.t = 0;
        }
        this.hist.push({ x: this.x, y: this.y, d: false });
      } else {
        const v = heartSpeed(this.t) * this.s;
        this.t += Math.min(STEP / Math.max(v, 0.5), 0.08);
        const p = heartPt(this.t * this.dir);
        const nx = this.cx + p.x * this.s, ny = this.cy + p.y * this.s;
        this.angle = Math.atan2(ny - this.y, nx - this.x);
        this.x = nx; this.y = ny;
        this.hist.push({ x: this.x, y: this.y, d: true });
        if (this.t >= Math.PI * 2) {
          this.state = 'travel';
          this.pickTarget();
        }
      }

      if (this.hist.length > TAIL_IDX + 5) this.hist.shift();

      // The beam comes out of the tail: emit where the tail currently is
      const tail = this.hist[this.hist.length - 1 - TAIL_IDX];
      if (tail && tail.d) {
        this.beam.push({ x: tail.x, y: tail.y, b: now });
        if (Math.random() < 0.3) {
          particles.push({
            x: tail.x, y: tail.y,
            vx: rand(-30, 30), vy: rand(-40, 10),
            life: 0, max: rand(500, 1000),
            r: rand(1, 2.6), col: Math.random() < .5 ? '#fff' : this.beamCol
          });
        }
      }
    }

    drawBeam(now) {
      const b = this.beam;
      while (b.length && now - b[0].b > BEAM_LIFE) b.shift();
      if (b.length < 2) return;
      const CH = 8;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      for (let i = 1; i < b.length; i += CH) {
        const end = Math.min(i + CH, b.length);
        const a = clamp(1 - (now - b[i].b) / BEAM_LIFE, 0, 1);
        ctx.beginPath();
        ctx.moveTo(b[i - 1].x, b[i - 1].y);
        for (let j = i; j < end; j++) {
          if (Math.abs(b[j].x - b[j - 1].x) + Math.abs(b[j].y - b[j - 1].y) > 10) ctx.moveTo(b[j].x, b[j].y);
          else ctx.lineTo(b[j].x, b[j].y);
        }
        ctx.strokeStyle = this.beamCol;
        ctx.globalAlpha = a * 0.22; ctx.lineWidth = 12; ctx.stroke();
        ctx.globalAlpha = a * 0.55; ctx.lineWidth = 6; ctx.stroke();
        ctx.strokeStyle = '#fff';
        ctx.globalAlpha = a * 0.95; ctx.lineWidth = 2.2; ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    draw(now) {
      const h = this.hist, n = h.length - 1;

      // body (outline pass, then color pass), tail -> head
      for (let pass = 0; pass < 2; pass++) {
        for (let i = SEGS; i >= 1; i--) {
          const p = h[n - i * GAP];
          if (!p) continue;
          const f = i / SEGS;
          const r = 2 + (HEAD_R - 2) * Math.pow(1 - f, 0.7) * 0.85;
          ctx.beginPath();
          ctx.arc(p.x, p.y, pass === 0 ? r + 1.4 : r, 0, Math.PI * 2);
          ctx.fillStyle = pass === 0 ? this.outline : (i % 3 === 0 ? this.stripe : this.col);
          ctx.fill();
        }
      }

      // glowing tail tip while drawing
      const tail = h[n - TAIL_IDX];
      if (tail && tail.d) {
        ctx.beginPath();
        ctx.arc(tail.x, tail.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.shadowColor = this.beamCol;
        ctx.shadowBlur = 14;
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      // head
      const hp = h[n], prev = h[n - 3] || h[0];
      const ang = Math.atan2(hp.y - prev.y, hp.x - prev.x);
      const r = HEAD_R;
      ctx.save();
      ctx.translate(hp.x, hp.y);
      ctx.rotate(ang);

      // tongue flick
      const flick = Math.sin(now / 160 + this.tongueSeed);
      if (flick > 0.55) {
        const len = r * 0.9 * (flick - 0.55) / 0.45 + r * 0.4;
        ctx.strokeStyle = '#ff3b6b';
        ctx.lineWidth = 1.6;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(r * 0.9, 0);
        ctx.lineTo(r * 0.9 + len, 0);
        ctx.lineTo(r * 0.9 + len + 3, -2.5);
        ctx.moveTo(r * 0.9 + len, 0);
        ctx.lineTo(r * 0.9 + len + 3, 2.5);
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.ellipse(0, 0, r * 1.25 + 1.4, r + 1.4, 0, 0, Math.PI * 2);
      ctx.fillStyle = this.outline; ctx.fill();
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 1.25, r, 0, 0, Math.PI * 2);
      ctx.fillStyle = this.col; ctx.fill();

      // blush
      ctx.fillStyle = 'rgba(255,110,160,.65)';
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.ellipse(r * 0.05, s * r * 0.72, r * 0.28, r * 0.17, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      // eyes
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.arc(r * 0.45, s * r * 0.42, r * 0.36, 0, Math.PI * 2);
        ctx.fillStyle = '#fff'; ctx.fill();
        ctx.beginPath();
        ctx.arc(r * 0.55, s * r * 0.42, r * 0.22, 0, Math.PI * 2);
        ctx.fillStyle = '#2b1b2e'; ctx.fill();
        ctx.beginPath();
        ctx.arc(r * 0.6, s * r * 0.42 - r * 0.08, r * 0.08, 0, Math.PI * 2);
        ctx.fillStyle = '#fff'; ctx.fill();
      }
      ctx.restore();
    }
  }

  let snakes = [];
  let last = 0;

  function startSnakes() {
    resize();
    const count = clamp(Math.round((W * H) / 75000), 7, 15);
    snakes = Array.from({ length: count }, (_, i) => new Snake(i));
    requestAnimationFrame(loop);
  }

  function loop(ts) {
    const dt = Math.min(50, last ? ts - last : 16);
    last = ts;
    ctx.clearRect(0, 0, W, H);

    for (const s of snakes) {
      s.acc += SPEED * dt / 1000;
      while (s.acc >= STEP) { s.acc -= STEP; s.stepOnce(ts); }
    }

    for (const s of snakes) s.drawBeam(ts);

    // sparkles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life += dt;
      if (p.life >= p.max) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt / 1000;
      p.y += p.vy * dt / 1000;
      ctx.globalAlpha = 1 - p.life / p.max;
      ctx.fillStyle = p.col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (const s of snakes) s.draw(ts);

    updateCat(dt, ts);
    updateGifts(dt, ts);

    requestAnimationFrame(loop);
  }
})();
</script>
</body>
